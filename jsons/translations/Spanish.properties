Blessings be upon you, wise and fearsome Chief Pocatello, revered leader of the Shoshone people. As the young chieftain of the Shoshone, you rose to face a wave of encroaching American settlements across the western United States. Forced to defend the Shoshone ancestral lands from a seemingly endless stream of new emigrants, your war band struck fear into those who would claim the sacred lands of your people. After years of strife, you skillfully avoided a direct conflict with the armies of the U.S. government, and negotiated a series of treaties in the hopes of establishing a lasting peace for the Shoshone. = Bendiciones para ti, sabio y temible jefe Pocatello, venerado líder del pueblo shoshón. Como joven jefe de los shoshones, te alzaste para hacer frente a una oleada de asentamientos estadounidenses que avanzaban por el oeste de los Estados Unidos. Obligado a defender las tierras ancestrales shoshonas de un flujo aparentemente interminable de nuevos emigrantes, tu partida de guerra sembró el miedo entre quienes pretendían reclamar las tierras sagradas de tu pueblo. Tras años de conflicto, evitaste hábilmente un enfrentamiento directo con los ejércitos del gobierno de EE. UU. y negociaste una serie de tratados con la esperanza de establecer una paz duradera para los shoshones.
Most esteemed Pocatello, your people once again look to you for guidance. Will you conquer your enemies, driving them far from your lands? Or will you seek out peaceful diplomacy and trade? Will you build a civilization that stands the test of time? = Estimadísimo Pocatello, tu pueblo busca de nuevo tu guía. ¿Conquistarás a tus enemigos, expulsándolos lejos de tus tierras? ¿O buscarás la diplomacia pacífica y el comercio? ¿Construirás una civilización que resista el paso del tiempo?
