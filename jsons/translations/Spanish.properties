Blessings upon you, noble Oda Nobunaga, ruler of Japan, the land of the Rising Sun! May you long walk among its flowering blossoms. The Japanese are an island people, proud and pious with a rich culture of arts and letters. Your civilization stretches back thousands of years, years of bloody warfare, expansion and isolation, great wealth and great poverty. In addition to their prowess on the field of battle, your people are also immensely industrious, and their technological innovation and mighty factories are the envy of lesser people everywhere. = ¡Bendiciones para ti, noble Oda Nobunaga, gobernante de Japón, la tierra del Sol Naciente! Que camines largo tiempo entre sus flores. Los japoneses son un pueblo isleño, orgulloso y piadoso, con una rica cultura artística y literaria. Tu civilización se remonta a miles de años, años de guerras sangrientas, expansión y aislamiento, gran riqueza y gran pobreza. Además de su destreza en el campo de batalla, tu pueblo es inmensamente trabajador, y su innovación tecnológica y sus poderosas fábricas son la envidia de los pueblos menores de todo el mundo.
Legendary daimyo, will you grab the reins of destiny? Will you bring your family and people the honor and glory they deserve? Will you once again pick up the sword and march to triumph? Will you build a civilization that stands the test of time? = Legendario daimio, ¿tomarás las riendas del destino? ¿Darás a tu familia y a tu pueblo el honor y la gloria que merecen? ¿Volverás a empuñar la espada y marcharás hacia el triunfo? ¿Construirás una civilización que resista el paso del tiempo?

Guten tag. In the name of the great German people, I bid you welcome. = Guten Tag. En nombre del gran pueblo alemán, te doy la bienvenida.
Hail mighty Bismarck, first canchellor of Germany and her empire! Germany is an upstart nation, fashioned from the ruins of the Holy Roman Empire and finally unified in 1871, a little more than a century ago. The German people have proven themselves to be creative, industrious a ferocious warriors. Despite enduring great catastrophes in the first half of the 20th century, Germany remains a worldwide economic, artistic and technological leader. = ¡Salve, poderoso Bismarck, primer canciller de Alemania y de su imperio! Alemania es una nación joven, forjada a partir de las ruinas del Sacro Imperio Romano Germánico y finalmente unificada en 1871, hace poco más de un siglo. El pueblo alemán ha demostrado ser creativo, trabajador y un pueblo de feroces guerreros. A pesar de haber sufrido grandes catástrofes en la primera mitad del siglo XX, Alemania sigue siendo un líder mundial en economía, arte y tecnología.
Great Prince Bismarck, the German people look up too you to lead them to greater days of glory. Their determination is strong, and now they turn to you, their beloved iron chancellor, to guide them once more. Will you rile and conquer through blood and iron, or foster the Germanic arts and industry? Can you build a civilization that will stand the test of time? = Gran príncipe Bismarck, el pueblo alemán confía en ti para que lo conduzcas a días de mayor gloria. Su determinación es fuerte, y ahora acude a ti, su querido canciller de hierro, para que lo guíes una vez más. ¿Gobernarás y conquistarás con sangre y hierro, o fomentarás las artes y la industria germánicas? ¿Podrás construir una civilización que resista el paso del tiempo?
