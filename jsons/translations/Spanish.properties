[Tourism] is the key to achieving a Cultural Victory. = El [Tourism] es la clave para lograr una victoria cultural.
[Tourism] is generated by Great Works or [Artifact]s that are placed in certain [Culture] buildings, and is the primary yield you will use to spread your cultural influence to other civilizations. As you place more and more Great Works and Artifacts into your [Museum]s, [Amphitheater]s, [Opera House]s, etc., your [Tourism] will continue to increase. Additionally, you can boost your [Tourism] output quite a bit through Open Borders, Trade Routes, shared Religion, and certain Ideological Tenets. = El [Tourism] lo generan las Grandes obras o los [Artifact] colocados en ciertos edificios de [Culture], y es el principal rendimiento que usarás para extender tu influencia cultural a otras civilizaciones. A medida que coloques más y más Grandes obras y Artefactos en tus [Museum], [Amphitheater], [Opera House], etc., tu [Tourism] seguirá aumentando. Además, puedes impulsar bastante tu producción de [Tourism] mediante Fronteras abiertas, rutas comerciales, una religión compartida y ciertos Principios ideológicos.

