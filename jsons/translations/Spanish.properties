Blessings be upon you, most gracious Queen Maria, protector and sovereign of the Portuguese people. As the first ever Queen regnant of Portugal, it was your wise stewardship that protected the royal court from the incursions of Napoleon, establishing a safe haven in Brazil to preserve the integrity of Portuguese rule. Despite struggling with illness throughout your reign, your effort to ensure Portugal's close cooperation with Brazil are credited with helping that state gain its eventual independence - and for this you will always be admired and respected by the people of both nations. = Bendiciones para ti, gentilísima reina María, protectora y soberana del pueblo portugués. Como primera reina reinante de Portugal, fue tu sabia administración la que protegió a la corte real de las incursiones de Napoleón, estableciendo un refugio seguro en Brasil para preservar la integridad del dominio portugués. A pesar de luchar contra la enfermedad durante todo tu reinado, a tu esfuerzo por asegurar la estrecha cooperación de Portugal con Brasil se le atribuye haber ayudado a ese estado a lograr su posterior independencia, y por ello siempre serás admirada y respetada por los pueblos de ambas naciones.
