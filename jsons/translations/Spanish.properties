The people of Morocco await your guidance, great Sultan Ahmad al-Mansur of the Saadi Dynasty. Well known for your skill as both a negotiator and a diplomat, your careful words allowed the forging of new alliances, securing the sovereignty of your nation and its people for decades. And still, when words failed, you found equal success in conquest, leading the Moroccan armies to victory on the battlefield while greatly expanding the grasp of your empire. = El pueblo de Marruecos aguarda tu guía, gran sultán Ahmad al-Mansur de la dinastía saadí. Conocido por tu habilidad como negociador y diplomático, tus cuidadosas palabras permitieron forjar nuevas alianzas, asegurando durante décadas la soberanía de tu nación y de su pueblo. Y aun así, cuando las palabras fallaban, encontrabas el mismo éxito en la conquista, llevando a los ejércitos marroquíes a la victoria en el campo de batalla y ampliando enormemente el alcance de tu imperio.
