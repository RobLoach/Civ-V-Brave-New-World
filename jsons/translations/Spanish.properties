To win a [Culture] Victory, you must become the dominant cultural influence in every civilization in the game. This is achieved through [Tourism] generated by Great Works that you create, and artifacts that you discover. The [Tourism] you generate has a constant impact on other civilizations, and its effect is amplified through Open Borders, Trade Routes, shared Religion and Ideologies, Research Agreements, etc. = Para lograr una victoria por [Culture], debes convertirte en la influencia cultural dominante en todas las civilizaciones de la partida. Esto se consigue mediante el [Tourism] generado por las Grandes obras que creas y los artefactos que descubres. El [Tourism] que generas tiene un impacto constante en otras civilizaciones, y su efecto se amplifica mediante Fronteras abiertas, rutas comerciales, religión e ideologías compartidas, acuerdos de investigación, etc.
