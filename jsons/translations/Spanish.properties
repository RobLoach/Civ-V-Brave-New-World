A [Trade Route] is required in order for a [Caravan] or [Cargo Ship] to establish a trade connection with other civilizations or City-States. = Se necesita una [Trade Route] para que una [Caravan] o un [Cargo Ship] establezca una conexión comercial con otras civilizaciones o ciudades-estado.

[Antiquity Site]s can be dug up for [Artifact]s, or turned into [Landmark]s, by [Archaeologist]s. = Los [Archaeologist] pueden excavar los [Antiquity Site] para obtener [Artifact] o convertirlos en [Landmark].

[Hidden Antiquity Site]s can be dug up by [Archaeologist]s for chance of a [Great Work of Writing] or a Cultural Renaissance. They are revealed by completing the [Exploration] Policy tree. = Los [Archaeologist] pueden excavar los [Hidden Antiquity Site] con la posibilidad de obtener una [Great Work of Writing] o un Renacimiento cultural. Se revelan al completar el árbol de políticas de [Exploration].

