Casimir III = Casimiro III
I have decided to end you! = ¡He decidido acabar contigo!
My armies will grind you to dust! = ¡Mis ejércitos te reducirán a polvo!
Celebrate your victory well...it might be your last one. = Celebra bien tu victoria... podría ser la última.
You are playing a dangerous game. = Estás jugando a un juego peligroso.
I, Casimir the Great, welcome you to the lands of the Great Kingdom of Poland. = Yo, Casimiro el Grande, te doy la bienvenida a las tierras del Gran Reino de Polonia.
How do you like my offer? = ¿Qué te parece mi oferta?
I salute you. = Te saludo.
What are you looking for here? = ¿Qué buscas aquí?
Solidarity = Solidaridad
Receive a free Social Policy when you advance to the next era. = Recibe una política social gratuita al avanzar a la siguiente era.
All hail noble King Casimir the Great, protector and sovereign of the Kingdom of Poland. You ascended to the throne during a time of great turmoil, with the nation's economy in shambles and its people demoralized by the wars of your predecessor. And yet, your reign marked the beginning of a new era, with affluence and security afforded only by way of your careful governance. Among your most notable achievements, the code of laws you established gave legal authority to many of the accepted customs of the time, strengthening the nation. = Salve al noble rey Casimiro el Grande, protector y soberano del Reino de Polonia. Ascendiste al trono en una época de gran agitación, con la economía de la nación en ruinas y su pueblo desmoralizado por las guerras de tu predecesor. Y, sin embargo, tu reinado marcó el comienzo de una nueva era, con una prosperidad y una seguridad que solo fueron posibles gracias a tu cuidadoso gobierno. Entre tus logros más notables, el código de leyes que estableciste dio autoridad legal a muchas de las costumbres aceptadas de la época, fortaleciendo la nación.
Honored king Casimir, the people have long admired the steady hand of governance you wield. Can you return your kingdom and its subjects to a golden age of prosperity? Will you conquer all those who oppose you, or strive for peaceful relations? Can you build a civilization that will stand the test of time? = Honorable rey Casimiro, el pueblo ha admirado durante mucho tiempo la mano firme con la que gobiernas. ¿Podrás devolver a tu reino y a tus súbditos a una edad de oro de prosperidad? ¿Conquistarás a todos los que se te opongan o buscarás relaciones pacíficas? ¿Podrás construir una civilización que resista el paso del tiempo?
