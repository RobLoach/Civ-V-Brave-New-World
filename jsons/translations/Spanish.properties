Ashurbanipal = Asurbanipal
I fear there is no other choice but to remove you from this world! = ¡Me temo que no hay otra opción que eliminarte de este mundo!
I think you will come to regret this decision...most unwise. = Creo que llegarás a lamentar esta decisión... muy imprudente.
We may be defeated, but our legacy will live on in the written word! = Puede que seamos derrotados, ¡pero nuestro legado perdurará en la palabra escrita!
You are full of bluster; I hope you've prepared yourself for what is to come. = Estás lleno de fanfarronería; espero que te hayas preparado para lo que está por venir.
I welcome you to the great kingdom of Assyria...have you come to view my library? = Te doy la bienvenida al gran reino de Asiria... ¿has venido a ver mi biblioteca?
Will you consider a trade? = ¿Considerarías un intercambio?
Treasures of Nineveh = Tesoros de Nínive
The people bow to your esteemed will, o wise and illustrious King Ashurbanipal of Assyria. Across the world, you are known as both a scholar and a warrior, and yet the legends represent merely a glimmer of your true ambition. Although your enemies cowered at the thought of your ferocity in conquest, you were most proud of your intellectual pursuits. Your thirst for knowledge led to your establishment of the royal library at Nineveh, which came to represent one of the greatest collections of ancient texts and tablets found anywhere in the world - securing your legacy as one of Assyria's greatest kings. = El pueblo se inclina ante tu estimada voluntad, oh sabio e ilustre rey Asurbanipal de Asiria. En todo el mundo se te conoce como erudito y guerrero, y aun así las leyendas representan apenas un destello de tu verdadera ambición. Aunque tus enemigos se acobardaban ante la idea de tu ferocidad en la conquista, lo que más te enorgullecía eran tus actividades intelectuales. Tu sed de conocimiento te llevó a fundar la biblioteca real de Nínive, que llegó a representar una de las mayores colecciones de textos y tablillas antiguos del mundo, asegurando tu legado como uno de los más grandes reyes de Asiria.
Wise and fearsome king, the time has come for you to return the kingdom of Assyria to its greatest heights. Will you once again strive to acquire the knowledge and histories of all the world's peoples? Can you build a civilization that will stand the test of time? = Sabio y temible rey, ha llegado el momento de que devuelvas al reino de Asiria a su máximo esplendor. ¿Te esforzarás de nuevo por adquirir el conocimiento y las historias de todos los pueblos del mundo? ¿Podrás construir una civilización que resista el paso del tiempo?
