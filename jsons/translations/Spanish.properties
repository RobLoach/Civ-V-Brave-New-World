All Hail his most respected and magnanimous Emperor, Pedro II of Brazil. It was with great insight and unshakeable dignity that you ruled the Brazilian empire for over 50 years, ushering in a time of lasting peace and prosperity. Your reputation as a stern, but fair leader was never blemished by controversy, as your unwavering dedication to the people of Brazil provided hope and established the kingdom's position in South America. Your scholarly pursuits and staunch defense of freedom of speech led to the creation of several institutions of higher learning, strengthening Brazil's sense of national identity. = Salve a su muy respetado y magnánimo emperador, Pedro II de Brasil. Con gran perspicacia y una dignidad inquebrantable gobernaste el imperio brasileño durante más de 50 años, dando paso a una época de paz y prosperidad duraderas. Tu reputación como líder severo pero justo nunca se vio empañada por la controversia, ya que tu inquebrantable dedicación al pueblo de Brasil le dio esperanza y consolidó la posición del reino en Sudamérica. Tus actividades académicas y tu firme defensa de la libertad de expresión llevaron a la creación de varias instituciones de educación superior, fortaleciendo el sentido de identidad nacional de Brasil.
Revered Emperor Pedro, your people long for a return to the peaceful days when you walked among them, hearing their stories and reassuring them of a bright future. Will you once again lead your kingdom to prosperity? Can you build a civilization that stands the test of time? = Venerado emperador Pedro, tu pueblo anhela volver a los días pacíficos en los que caminabas entre ellos, escuchando sus historias y asegurándoles un futuro brillante. ¿Llevarás de nuevo a tu reino a la prosperidad? ¿Podrás construir una civilización que resista el paso del tiempo?
