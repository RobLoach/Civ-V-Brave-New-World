[Bison] are found in [Plains] and [Grassland], providing [Food] that allows cities in these regions to grow even more rapidly. Improve them with [Camp]s as soon as you're able, and you'll turn nearby cities into [Population] and [Production] centers.  = Los [Bison] se encuentran en [Plains] y [Grassland], y proporcionan [Food] que permite a las ciudades de estas regiones crecer aún más rápido. Mejóralos con [Camp] en cuanto puedas y convertirás las ciudades cercanas en centros de [Population] y [Production].

Cocoa = Cacao
[Cocoa], like [Bananas], is found only in [Jungle]s. You'll have to remove the [Jungle] to improve it with a [Plantation], but it's usually worth your while if you need extra [Happiness] and [Gold]. = El [Cocoa], como los [Bananas], solo se encuentra en [Jungle]. Tendrás que eliminar la [Jungle] para mejorarlo con una [Plantation], pero normalmente merece la pena si necesitas [Happiness] y [Gold] adicionales.

[Nutmeg] is a unique luxury resource which appears only in one of the first three [Indonesia]n cities founded on landmasses other than the one their [Capital] is on. = La [Nutmeg] es un recurso de lujo único que solo aparece en una de las tres primeras ciudades de [Indonesia] fundadas en masas de tierra distintas de aquella en la que se encuentra su [Capital].

