Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Long have your people lived near the great and holy lake Ontario in the land that has come to be known as the New York state in North America. In the mists of antiquity, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida united into one nation, the Haudenosaunee, the Iroquois. With no written language, the wise men of your nation created the great law of peace, the model for many contitutions including that of the United States. For many years, your people battled great enemies, such as the Huron, and the French and English invaders. Tought outnumbered and facing weapons far more advanced than the ones your warriors wielded, the Iroquois survived and prospered, until they were finally overwhelmed by the mighty armies of the new United States. = ¡Saludos, noble Hiawatha, líder de las poderosas naciones iroquesas! Tu pueblo ha vivido durante mucho tiempo cerca del grande y sagrado lago Ontario, en la tierra que ha llegado a conocerse como el estado de Nueva York, en Norteamérica. En las brumas de la antigüedad, los cinco pueblos séneca, onondaga, mohawk, cayuga y oneida se unieron en una sola nación, los haudenosaunee, los iroqueses. Sin lengua escrita, los sabios de tu nación crearon la gran ley de la paz, modelo de muchas constituciones, incluida la de los Estados Unidos. Durante muchos años, tu pueblo luchó contra grandes enemigos, como los hurones y los invasores franceses e ingleses. Aunque superados en número y enfrentados a armas mucho más avanzadas que las que empuñaban tus guerreros, los iroqueses sobrevivieron y prosperaron, hasta que finalmente fueron arrollados por los poderosos ejércitos de los nuevos Estados Unidos.
Oh noble Hiawatha, listen to the cries of your people! They call out to you to lead them in peace and war, to rebuild the great longhouse and unite the tribes once again. Will you accept this challenge, great leader? Will you build a civilization that will stand the test of time? = ¡Oh, noble Hiawatha, escucha los clamores de tu pueblo! Te llaman para que los guíes en la paz y en la guerra, para que reconstruyas la gran casa comunal y unas de nuevo a las tribus. ¿Aceptarás este desafío, gran líder? ¿Construirás una civilización que resista el paso del tiempo?
