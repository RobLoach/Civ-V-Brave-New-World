Greetings, most astute Doge Enrico Dandolo of Venice, master of statecraft and shrewd negotiator. Although you rose to power late in life, old age did little to slow your cunning or ambition, as you deftly managed the bustling commercial center of Venice during a time of great instability. In aligning yourself with the Fourth Crusade, you carefully gained a strategic advantage and used the Crusaders to reacquire lost territory for Venice. Your role in guiding the Crusaders during the sacking of Constantinople led to an even greater expansion of your power, and secured your legacy throughout history. = Saludos, astutísimo dux Enrico Dandolo de Venecia, maestro del arte de gobernar y sagaz negociador. Aunque llegaste al poder a una edad avanzada, la vejez apenas frenó tu astucia o tu ambición, pues gestionaste con destreza el bullicioso centro comercial de Venecia en una época de gran inestabilidad. Al aliarte con la Cuarta Cruzada, obtuviste con cuidado una ventaja estratégica y utilizaste a los cruzados para recuperar territorios perdidos para Venecia. Tu papel guiando a los cruzados durante el saqueo de Constantinopla supuso una expansión aún mayor de tu poder y aseguró tu legado a lo largo de la historia.
Most insightful and cunning Doge, Venice once again requires the service of a skilled leader, one who can bring the republic back to the forefront of world affairs. Can you establish your nation through careful trade, or will you work to conquer your enemies through diplomacy? Can you build a civilization that will stand the test of time? = Perspicaz y astuto dux, Venecia requiere de nuevo los servicios de un líder hábil, alguien capaz de devolver a la república a la vanguardia de los asuntos mundiales. ¿Podrás consolidar tu nación mediante un comercio cuidadoso, o trabajarás para conquistar a tus enemigos mediante la diplomacia? ¿Podrás construir una civilización que resista el paso del tiempo?
