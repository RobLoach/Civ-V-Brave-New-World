Ahmad al-Mansur = Ахмад аль-Мансур
The gain from the war, what will you get out of it? = Користь від війни — що ви отримаєте з неї?
Shame on you, using violence which doesn't solve anything. = Ганьба вам за використання насильства, яке нічого не вирішує.
The gain is having a clean system from corruption. = Користь полягає в наявності системи, очищеної від корупції.
I can't take such remarks seriously. = Я не можу сприймати такі зауваження серйозно.
I am the Sultan of Marrakesh Ahmad Al-Mansur, in the name of my people I welcome you! = Я султан Марракеша Ахмад аль-Мансур, іменем мого народу вітаю тебе!
I came with all hope, but haven't reached an agreement. = Я прийшов з усією надією, але не досяг угоди.
What are you doing here? = Що ви тут робите?
Gateway to Africa = Ворота до Африки
The people of Morocco await your guidance, great Sultan Ahmad al-Mansur of the Saadi Dynasty. Well known for your skill as both a negotiator and a diplomat, your careful words allowed the forging of new alliances, securing the sovereignty of your nation and its people for decades. And still, when words failed, you found equal success in conquest, leading the Moroccan armies to victory on the battlefield while greatly expanding the grasp of your empire. = Народ Марокко чекає на ваші настановлення, великий султане Ахмаде аль-Мансур з династії Саадитів. Добре відомий своїми навичками переговорника й дипломата, ваші виважені слова дозволили укласти нові союзи, забезпечивши суверенітет вашої нації та її народу на десятиліття вперед. І все ж, коли слів було недостатньо, ви досягли такого ж успіху в завоюваннях, ведучи марокканські армії до перемоги на полі бою та значно розширюючи вплив вашої імперії.
Wise and respected Sultan, the people look to you for leadership. Can your diplomacy match that of your rivals, or will you meet them sword in hand? Your once great kingdom yearns for that former glory - can you build a civilization that stands the test of time? = Мудрий і шанований султане, народ дивиться на вас у пошуках керівництва. Чи зможе ваша дипломатія зрівнятися з дипломатією ваших суперників, чи ви зустрінете їх із мечем у руці? Ваше колись велике королівство прагне тієї колишньої слави — чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
