Maria I = Марія I
I'm afraid I cannot allow your kingdom to exist for much longer! I hope you won't mind... = Боюсь, я не можу дозволити вашому королівству існувати далі! Сподіваюся, ви не проти...
You cannot be serious! = Ви це несерйозно!
I know little about this conflict...I'll have to consult my regent... = Я мало знаю про цей конфлікт… Мені доведеться порадитися з моїм регентом…
Am I meant to take your threats seriously? = Я мушу сприймати ваші погрози серйозно?
I am Maria, Queen of Portugal! Have we met before? You look familiar to me... Or maybe not. = Я Марія, королева Португалії! Ми зустрічалися раніше? Ти здаєшся мені знайомим... Чи, можливо, ні.
Will you consider this offer? = Чи розглянете ви цю пропозицію?
Good morning. = Доброго ранку.
Why did you come? = Чому ви прийшли?
Mare Clausum = Mare Clausum
Resource diversity grants twice as much [Gold] for Portugal in [Trade Route]s. = Різноманітність ресурсів надає удвічі більше [Gold] для Португалії у [Trade Route].
Blessings be upon you, most gracious Queen Maria, protector and sovereign of the Portuguese people. As the first ever Queen regnant of Portugal, it was your wise stewardship that protected the royal court from the incursions of Napoleon, establishing a safe haven in Brazil to preserve the integrity of Portuguese rule. Despite struggling with illness throughout your reign, your effort to ensure Portugal's close cooperation with Brazil are credited with helping that state gain its eventual independence - and for this you will always be admired and respected by the people of both nations. = Благословення хай перебуває з вами, наймилостивіша королево Маріє, захиснице та суверенна правителько португальського народу. Як перша в історії королева-правителька Португалії, саме ваше мудре керівництво захистило королівський двір від вторгнень Наполеона, створивши надійний притулок у Бразилії для збереження цілісності португальського правління. Незважаючи на боротьбу з хворобою протягом усього правління, ваші зусилля щодо забезпечення тісної співпраці Португалії з Бразилією вважаються важливими для здобуття цією країною незалежності — і за це вами завжди захоплюватимуться й поважатимуть люди обох націй.
Oh noble and pious queen, will you once again guide the kingdom of Portugal in the spirit of cooperation and prosperity? Will you establish a new legacy, one that will surpass all those who come before you? Can you build a civilization that will stand the test of time? = О благородна й благочестива королево, чи погодитеся ви знову вести королівство Португалію в дусі співпраці та процвітання? Чи створите ви нову спадщину, яка перевершить усіх ваших попередників? Чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
