Enrico Dandolo = Енріко Дандоло
When you will be gone, Sir, there will be more for me! = Коли ви зникнете, пане, у мене буде більше можливостей!
You have revealed your purposes too early, my friend! = Ви розкрили свої наміри занадто рано, мій друже!
I have little concern for such obvious bluster. = Мене мало турбує таке очевидне вихваляння.
Welcome to Venice. I am Doge Enrico Dandolo. = Ласкаво просимо до Венеції. Я дож Енріко Дандоло.
This offer won't be valid for a lot of time, think about it. = Ця пропозиція не буде дійсною довго, подуйте над нею.
You! What do you want? = Ви! Чого ви хочете?
Greetings, most astute Doge Enrico Dandolo of Venice, master of statecraft and shrewd negotiator. Although you rose to power late in life, old age did little to slow your cunning or ambition, as you deftly managed the bustling commercial center of Venice during a time of great instability. In aligning yourself with the Fourth Crusade, you carefully gained a strategic advantage and used the Crusaders to reacquire lost territory for Venice. Your role in guiding the Crusaders during the sacking of Constantinople led to an even greater expansion of your power, and secured your legacy throughout history. = Вітання, наймудріший доже Венеції Енріко Дандоло, майстре державних справ і проникливий переговорнику. Хоча ви прийшли до влади в похилому віці, старість не завадила вашим хитрощам чи амбіціям, оскільки ви вправно керували бурхливим торговим центром Венеції під час великої нестабільності. Об'єднавшись із Четвертим хрестовим походом, ви стратегічно виграли та використали хрестоносців для повернення втрачених територій для Венеції. Ваша роль у керівництві хрестоносцями під час розграбування Константинополя привела до ще більшого розширення вашої влади та закарбувала вашу спадщину в історії.
Most insightful and cunning Doge, Venice once again requires the service of a skilled leader, one who can bring the republic back to the forefront of world affairs. Can you establish your nation through careful trade, or will you work to conquer your enemies through diplomacy? Can you build a civilization that will stand the test of time? = Найпроникливіший і найхитріший доже, Венеція знову потребує послуг умілого лідера, який зможе повернути республіку на передову світових справ. Чи зможете ви розбудувати свою державу через обачну торгівлю, чи прагнутимете підкорити ворогів за допомогою дипломатії? Чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
