All hail noble King Casimir the Great, protector and sovereign of the Kingdom of Poland. You ascended to the throne during a time of great turmoil, with the nation's economy in shambles and its people demoralized by the wars of your predecessor. And yet, your reign marked the beginning of a new era, with affluence and security afforded only by way of your careful governance. Among your most notable achievements, the code of laws you established gave legal authority to many of the accepted customs of the time, strengthening the nation. = Хай живе благородний король Казимир Великий, захисник і суверенний правитель Королівства Польща. Ви зійшли на престол у період великих потрясінь, коли економіка країни була зруйнована, а народ деморалізований війнами вашого попередника. І все ж ваше правління ознаменувало початок нової епохи, забезпеченої достатком і безпекою завдяки мудрому управлінню. Серед ваших найвизначніших досягнень — створений вами кодекс законів, який надав юридичної сили багатьом звичаям того часу, зміцнивши націю.
Honored king Casimir, the people have long admired the steady hand of governance you wield. Can you return your kingdom and its subjects to a golden age of prosperity? Will you conquer all those who oppose you, or strive for peaceful relations? Can you build a civilization that will stand the test of time? = Шановний королю Казимире, народ давно захоплюється твердістю вашого управління. Чи зможете ви повернути своє королівство та його підданих до золотої доби процвітання? Чи підкорите ви всіх, хто протистоїть вам, чи прагнутимете мирних відносин? Чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
