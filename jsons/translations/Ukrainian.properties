Very well. I'm sure you have your reasons. = Дуже добре. Я впевнений, що у вас є свої причини.
Blessings upon you, noble Oda Nobunaga, ruler of Japan, the land of the Rising Sun! May you long walk among its flowering blossoms. The Japanese are an island people, proud and pious with a rich culture of arts and letters. Your civilization stretches back thousands of years, years of bloody warfare, expansion and isolation, great wealth and great poverty. In addition to their prowess on the field of battle, your people are also immensely industrious, and their technological innovation and mighty factories are the envy of lesser people everywhere. = Благословення тобі, благородний Ода Нобунаґа, правителю Японії, Землі Вранішнього Сонця! Нехай твої дні будуть довгими серед квітучих садів. Японці — острівний народ, гордий і благочестивий, із багатою культурою мистецтва та літератури. Історія твоєї цивілізації налічує тисячі років кривавих воєн, розширення кордонів та ізоляції, великого багатства й глибокої бідності. Окрім військової майстерності на полі бою, твій народ також надзвичайно працьовитий, а їхні технологічні інновації та потужні фабрики викликають заздрість.
Legendary daimyo, will you grab the reins of destiny? Will you bring your family and people the honor and glory they deserve? Will you once again pick up the sword and march to triumph? Will you build a civilization that stands the test of time? = Легендарний даймьо, чи візьмеш ти кермо долі у свої руки? Чи принесеш ти своїй родині та народу честі й слави, на які вони заслуговують? Чи візьмеш ти знову меч і вирушиш до тріумфу? Чи побудуєш ти цивілізацію, яка витримає іспит часом?

Guten tag. In the name of the great German people, I bid you welcome. = Guten tag. В ім'я великого німецького народу вітаю вас.
Hail mighty Bismarck, first canchellor of Germany and her empire! Germany is an upstart nation, fashioned from the ruins of the Holy Roman Empire and finally unified in 1871, a little more than a century ago. The German people have proven themselves to be creative, industrious a ferocious warriors. Despite enduring great catastrophes in the first half of the 20th century, Germany remains a worldwide economic, artistic and technological leader. = Вітання могутьньому Бісмарку, першому канцлеру Німеччини та її імперії! Німеччина — молода держава, створена з руїн Священної Римської імперії та остаточно об'єднана в 1871 році, трохи більше століття тому. Німецький народ довів, що є творчим, працьовитим і відважним воїном. Незважаючи на катастрофи першої половини XX століття, Німеччина залишається світовим лідером в економіці, мистецтві та технологіях.
Great Prince Bismarck, the German people look up too you to lead them to greater days of glory. Their determination is strong, and now they turn to you, their beloved iron chancellor, to guide them once more. Will you rile and conquer through blood and iron, or foster the Germanic arts and industry? Can you build a civilization that will stand the test of time? = Великий князю Бісмарку, німецький народ покладає на вас надії, щоб ви повели їх до нових вершин слави. Наснага народу міцна, і тепер вони звертаються до вас, свого улюбленого залізного канцлера, щоб ви знову очолили їх. Чи будете ви розпалювати війни й перемагати кров'ю та залізом, чи сприятимете розвитку мистецтва та промисловості? Чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
