Ashurbanipal = Ашшурбаніпал
I fear there is no other choice but to remove you from this world! = Боюсь, немає іншого вибору, окрім як стерти вас із лиця землі!
I think you will come to regret this decision...most unwise. = Думаю, ви незабаром пошкодуєте про таке рішення... Вкрай нерозумно.
We may be defeated, but our legacy will live on in the written word! = Ми можемо бути розгромлені, але наша спадщина житиме в писемностях!
You are full of bluster; I hope you've prepared yourself for what is to come. = Ви сповнені гучних слів; сподіваюся, ви підготувалися до того, що станеться далі.
I welcome you to the great kingdom of Assyria...have you come to view my library? = Ласкаво прошу до великого царства Ассирії... Ви прийшли подивитися на мою бібліотеку?
Will you consider a trade? = Розглянете пропозицію про торгівлю?
Treasures of Nineveh = Скарби Ніневії
The people bow to your esteemed will, o wise and illustrious King Ashurbanipal of Assyria. Across the world, you are known as both a scholar and a warrior, and yet the legends represent merely a glimmer of your true ambition. Although your enemies cowered at the thought of your ferocity in conquest, you were most proud of your intellectual pursuits. Your thirst for knowledge led to your establishment of the royal library at Nineveh, which came to represent one of the greatest collections of ancient texts and tablets found anywhere in the world - securing your legacy as one of Assyria's greatest kings. = Народ схиляється перед вашою високоповажною волею, о мудрий і славний царю Ашшурбаніпале з Ассирії. У усьому світі ви відомі як вчений і воїн, проте легенди відображають лише відблиск ваших справжніх амбіцій. Хоча ваші вороги тремтіли при думці про вашу лютість у завоюваннях, ви найбільше пишалися своїми інтелектуальними прагненнями. Ваша жадоба знань привела до створення королівської бібліотеки в Ніневії, яка стала однією з найвидатніших колекцій стародавніх текстів і табличок у світі, закріпивши вашу спадщину як одного з найвеличніших царів Ассирії.
Wise and fearsome king, the time has come for you to return the kingdom of Assyria to its greatest heights. Will you once again strive to acquire the knowledge and histories of all the world's peoples? Can you build a civilization that will stand the test of time? = Мудрий і грізний царю, настав час повернути царство Ассирії до найвищих вершин. Чи будете ви знову прагнути здобути знання й історію всіх народів світу? Чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
