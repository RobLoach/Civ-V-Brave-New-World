Gajah Mada = Ґаджа Мада
You stand between my army and their destiny... Prepare for war! = Ти стоїш між моєю армією та її долею… Готуйся до війни!
You dare attack the great Gajah Mada?! = Ви наважилися напасти на великого Ґаджа Маду?!
I'm impressed by your victory, even if it came at my expense. = Я вражений вашою перемогою, навіть якщо вона далася моїм коштом.
Your words ring hollow. = Ваші слова порожні.
You stand before the great Gajah Mada of Indonesia! What brings you to my empire? = Ви стоїте перед великим Ґаджа Мадою Індонезії! Що привело вас до моєї імперії?
What if we make a deal, you and me? = А що, коли ми укладемо угоду, ти і я?
Are you a male concubine, stranger? = Ти наложник, незнайомцю?
Spice Islanders = Жителі Островів Прянощів
The first 3 cities founded on continents other than where Indonesia started each provide 2 copies of [Cloves], [Pepper], or [Nutmeg]. = Перші три міста, засновані на континентах, окрім того, де розпочала Індонезія, надають по дві копії кожного з ресурсів [Cloves], [Pepper] або [Nutmeg].
Honour be with you, oh great hero Gajah Mada, prime minister of Majapahit and uniter of the Indonesian archipelago. The stories of your heroism on the battlefield are bested only by the legends of your sworn oath to unite the far-flung islands of Indonesia under one banner. Serving your queen and empire with loyalty, you not only strive to fulfill your oath and conquered any who stood in your path, but you succeeded in capturing what was then the entirety of the known archipelago, the first to unite what is today modern Indonesia. = Нехай честь буде з вами, о великий герою Ґаджа Мадо, прем'єр-міністре Маджапахіту та об'єднувачу Індонезійського архіпелагу. Історії вашого героїзму на полях битв поступаються лише легендам про вашу священну клятву об'єднати розкидані острови Індонезії під одним прапором. Служачи своїй королеві та імперії з відданістю, ви не лише прагнули виконати свою клятву та підкорили всіх, хто став на вашому шляху, а й змогли захопити весь відомий тоді архіпелаг, ставши першим, хто об'єднав сучасну Індонезію.
Mighty warrior Gajah Mada, your people yearn for a strong leader who can return them to prosperity! Will you set out to conquer the neighboring kingdoms, further expanding your glory of your empire? Will you build a civilization that can stand the test of time? = Могутній воїне Ґаджа Мадо, ваш народ прагне сильного лідера, здатного повернути їх до процвітання! Чи вирушите ви завойовувати сусідні королівства, розширюючи славу вашої імперії? Чи побудуєте ви цивілізацію, яка витримає іспит часом?
