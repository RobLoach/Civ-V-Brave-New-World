Ready yourself... War is coming. = Готуйтеся... Наближається війна.
I will not kneel to unwarranted aggression! = Я не схилюся перед безпідставною агресією!
This will not be the end of my people, I assure you. = Це не стане кінцем мого народу, запевняю вас.
Your words are meaningless. = Ваші слова беззмістовні.
I am Pocatello of the Shoshone, I greet you in the hopes of a peaceful and prosperous relationship. = Я Покателло із шошонів, я вітаю вас у надії на мирні та процвітаючі відносини.
Would you listen to my proposal? = Бажаєте вислухати мою пропозицію?
Great Expanse = Великі простори
Blessings be upon you, wise and fearsome Chief Pocatello, revered leader of the Shoshone people. As the young chieftain of the Shoshone, you rose to face a wave of encroaching American settlements across the western United States. Forced to defend the Shoshone ancestral lands from a seemingly endless stream of new emigrants, your war band struck fear into those who would claim the sacred lands of your people. After years of strife, you skillfully avoided a direct conflict with the armies of the U.S. government, and negotiated a series of treaties in the hopes of establishing a lasting peace for the Shoshone. = Благословення хай перебуває з тобою, мудрий і грізний вождь Покателло, шанований лідере народу шошонів. Будучи молодим вождем шошонів, ви встали на захист проти хвилі американських поселень на заході Сполучених Штатів. Змушений захищати предківські землі шошонів від нескінченного потоку нових емігрантів, ваш військовий загін вселяв страх у тих, хто зазіхав на священні землі вашого народу. Після років боротьби ви уміло уникнули прямого конфлікту з арміями уряду США та уклали низку договорів у надії встановити тривалий мир для шошонів.
Most esteemed Pocatello, your people once again look to you for guidance. Will you conquer your enemies, driving them far from your lands? Or will you seek out peaceful diplomacy and trade? Will you build a civilization that stands the test of time? = Високошанований Покателло, ваш народ знову шукає вашого керівництва. Чи завоюєте ви своїх ворогів, прогнавши їх далеко від ваших земель? Чи шукатимете мирну дипломатію та торгівлю? Чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
