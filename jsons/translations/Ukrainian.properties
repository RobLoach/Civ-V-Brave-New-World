To win a [Culture] Victory, you must become the dominant cultural influence in every civilization in the game. This is achieved through [Tourism] generated by Great Works that you create, and artifacts that you discover. The [Tourism] you generate has a constant impact on other civilizations, and its effect is amplified through Open Borders, Trade Routes, shared Religion and Ideologies, Research Agreements, etc. = Щоб здобути культурну перемогу [Culture], ви повинні стати домінуючим культурним чинником у кожній цивілізації гри. Це досягається за допомогою [Tourism], який створюють Великі витвори та виявлені артефакти. [Tourism], який ви отримуєте, постійно впливає на інші цивілізації, а його ефект посилюється через відкриті кордони, торгові маршрути, спільну релігію та ідеології, наукові угоди тощо.
