#################### Lines from TileResources ####################


Bison = Бізон
[Bison] are found in [Plains] and [Grassland], providing [Food] that allows cities in these regions to grow even more rapidly. Improve them with [Camp]s as soon as you're able, and you'll turn nearby cities into [Population] and [Production] centers.  = [Bison] зустрічаються на рівнинах ([Plains]) та луках ([Grassland]), забезпечуючи їжею ([Food]), що дозволяє містам у цих регіонах рости ще швидше. Покращуйте їх за допомогою [Camp], як тільки зможете, і ви перетворите прилеглі міста на центри населення ([Population]) та виробництва ([Production]).

Cocoa = Какао
[Cocoa], like [Bananas], is found only in [Jungle]s. You'll have to remove the [Jungle] to improve it with a [Plantation], but it's usually worth your while if you need extra [Happiness] and [Gold]. = [Cocoa], як і [Bananas], зустрічається виключно в джунглях ([Jungle]). Вам доведеться розчистити джунглі [Jungle], щоб облаштувати плантацію ([Plantation]), однак зазвичай це варте зусиль, якщо вам потрібне додаткове щастя ([Happiness]) та золото ([Gold]).

[Nutmeg] is a unique luxury resource which appears only in one of the first three [Indonesia]n cities founded on landmasses other than the one their [Capital] is on. = [Nutmeg] є унікальним ресурсом розкоші, який з'являється лише в одному з перших трьох міст [Indonesia], заснованому на материку, відмінному від того, де розташована [Capital].

[Cloves] are a unique luxury resource which appear only in one of the first three [Indonesia]n cities founded on landmasses other than the one their [Capital] is on. = [Cloves] є унікальним ресурсом розкоші, який з'являється лише в одному з перших трьох міст [Indonesia], заснованому на материку, відмінному від того, де розташована [Capital].


A [Trade Route] is required in order for a [Caravan] or [Cargo Ship] to establish a trade connection with other civilizations or City-States. = Для встановлення торговельного зв'язку з іншими цивілізаціями або містами-державами потрібен [Trade Route] для підрозділів [Caravan] або [Cargo Ship].

[Antiquity Site]s can be dug up for [Artifact]s, or turned into [Landmark]s, by [Archaeologist]s. = Стародавні місця ([Antiquity Site]) можуть бути розкопані для здобуття [Artifact] або перетворені на пам'ятки ([Landmark]) за допомогою [Archaeologist].

[Hidden Antiquity Site]s can be dug up by [Archaeologist]s for chance of a [Great Work of Writing] or a Cultural Renaissance. They are revealed by completing the [Exploration] Policy tree. = Приховані стародавні місця ([Hidden Antiquity Site]) можуть бути розкопані [Archaeologist] для отримання шансу знайти літературний витвір ([Great Work of Writing]) або спричинити культурне Відродження. Вони відкриваються після завершення гілки політики дослідження ([Exploration]).

Slotted into a [Great Work of Writing] Slot = Розміщено в слоті для [Great Work of Writing]


Great Work of Music = Музичний витвір

[Artifact]s are found from an [Archaeological Dig] with an [Archaeologist] on an [Antiquity Site]. They can then be slotted into a [Great Work of Art] Slot. = Артефакти ([Artifact]) виявляються шляхом проведення [Archaeological Dig] за допомогою [Archaeologist] на місці стародавньої пам'ятки ([Antiquity Site]). Потім вони можуть бути поміщені в слот для [Great Work of Art].

[Tourism] is the key to achieving a Cultural Victory. = Туризм ([Tourism]) — ключ до досягнення культурної перемоги.
[Tourism] is generated by Great Works or [Artifact]s that are placed in certain [Culture] buildings, and is the primary yield you will use to spread your cultural influence to other civilizations. As you place more and more Great Works and Artifacts into your [Museum]s, [Amphitheater]s, [Opera House]s, etc., your [Tourism] will continue to increase. Additionally, you can boost your [Tourism] output quite a bit through Open Borders, Trade Routes, shared Religion, and certain Ideological Tenets. = Туризм ([Tourism]) створюється Великими витворами або артефактами ([Artifact]), розміщеними в певних будівлях культури ([Culture]), і є основним ресурсом, який ви використовуватимете для поширення свого культурного впливу на інші цивілізації. У міру того як ви розміщуєте все більше Великих витворів та артефактів у ваші [Museum], [Amphitheater], [Opera House] тощо, ваш [Tourism] продовжуватиме зростати. Крім того, ви можете суттєво збільшити [Tourism] завдяки відкритим кордонам, торговельним маршрутам, спільній релігії та певним догматам ідеології.

Level 1 Policy = Політика рівню 1

Level 2 Policy = Політика рівню 2

Accumulated Culture = Накопичена культура


