Pedro II = Педру II
Your reign will be better under MY domain. = Ваше правління стане кращим під МОЄЮ владою.
I worry about all those who are affected by this conflict. = Я хвилююся за всіх, кого зачепив цей конфлікт.
This is why I prefer diplomacy to violence... = Ось чому я віддаю перевагу дипломатії, а не насильству...
What foolishness is this? Do you expect anyone to take you seriously? = Що це за дурість? Ви очікуєте, що хтось сприйме вас серйозно?
I am Pedro, Emperor of Brazil. I have little time for pleasantries, what brings you here? = Я Педру, імператор Бразилії. У мене обмаль часу на люб'язності, що привело вас сюди?
Should we prosper through commerce? = Чи повинні ми процвітати завдяки торгівлі?
Carnival = Карнавал
All Hail his most respected and magnanimous Emperor, Pedro II of Brazil. It was with great insight and unshakeable dignity that you ruled the Brazilian empire for over 50 years, ushering in a time of lasting peace and prosperity. Your reputation as a stern, but fair leader was never blemished by controversy, as your unwavering dedication to the people of Brazil provided hope and established the kingdom's position in South America. Your scholarly pursuits and staunch defense of freedom of speech led to the creation of several institutions of higher learning, strengthening Brazil's sense of national identity. = Слава найшанованішому та найвеликодушнішому імператору Педру II з Бразилії. З великою мудрістю та непохитною гідністю ви правили Бразильською імперією понад 50 років, відкривши епоху тривалого миру та процвітання. Ваша репутація суворого, але справедливого лідера ніколи не була заплямована скандалами, оскільки ваша непохитна відданість народу Бразилії давала надію та зміцнила становище королівства в Південній Америці. Ваші наукові вишукування та твердий захист свободи слова сприяли створенню кількох вищих навчальних закладів, посилюючи відчуття національної ідентичності Бразилії.
Revered Emperor Pedro, your people long for a return to the peaceful days when you walked among them, hearing their stories and reassuring them of a bright future. Will you once again lead your kingdom to prosperity? Can you build a civilization that stands the test of time? = Шанований імператоре Педру, ваш народ прагне повернення мирних днів, коли ви ходили серед них, слухали їхні історії та запевняли у світлому майбутньому. Чи поведете ви знову своє королівство до процвітання? Чи зможете ви побудувати цивілізацію, яка витримає іспит часом?
