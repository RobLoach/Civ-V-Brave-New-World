Shaka = Шака
None will slow our progress, not even you! Prepare for war! = Ніхто не уповільнить наш прогрес, навіть ви! Готуйтеся до війни!
Your arrogance will only lead you to defeat! = Ваша пиха призведе вас лише до поразки!
My warriors have failed, and so I failed them. = Мої воїни зазнали невдачі, і тим самим я підвів їх.
You may live to regret this. = Можливо, ви пошкодуєте про це.
I'm Shaka of Zulu. Don't try to move, warrior, or I'll destroy you. = Я Шака із зулусів. Навіть не намагайся поворухнутися, воїне, інакше я знищу тебе.
Approve the closure sell. = Затвердити закриття продажу.
Hail your Majesty! = Вітаю вашу величність!
You say? What are you doing here? = Кажете? Що ви тут робите?
Iklwa = Іклва
Your people kneel before you, great warrior Shaka of the Zulu Kingdom. As you rose from a place of exile to become the true leader of the Zulus, you ushered in changes throughout the Zulu society, implementing new laws and cultural reforms that strengthened the position of your kingdom. However, it was your tenacity in the art of war that truly established your reputation, as your tactics and strategies on the battlefield forever changed the face of combat across the plains of southern Africa. = Ваш народ схиляє коліна перед вами, великий воїне Шака з Королівства Зулу. Піднявшись із вигнання та ставши справжнім лідером зулусів, ви розпочали зміни в усьому зулуському суспільстві, запровадивши нові закони та культурні реформи, які зміцнили становище вашого королівства. Однак саме ваша непохитність у військовому мистецтві дійсно створила вашу репутацію, оскільки ваша тактика й стратегія на полі бою назавжди змінили обличчя війни на рівнинах південної Африки.
Most formidable king, your people once again long for the unity and strength your leadership afforded them. Can you return the Zulu kingdom to such great prominence? Will you build a civilization that stands the test of time? = Найгрізніший королю, ваш народ знову прагне єдності та сили, яку забезпечувало ваше керівництво. Чи зможете ви повернути королівство Зулу до такої видатної величі? Чи побудуєте ви цивілізацію, яка витримає іспит часом?
