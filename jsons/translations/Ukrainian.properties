Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Long have your people lived near the great and holy lake Ontario in the land that has come to be known as the New York state in North America. In the mists of antiquity, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida united into one nation, the Haudenosaunee, the Iroquois. With no written language, the wise men of your nation created the great law of peace, the model for many contitutions including that of the United States. For many years, your people battled great enemies, such as the Huron, and the French and English invaders. Tought outnumbered and facing weapons far more advanced than the ones your warriors wielded, the Iroquois survived and prospered, until they were finally overwhelmed by the mighty armies of the new United States. = Вітання, благородний Гайавато, лідере могутної нації ірокезів! Довго ваш народ жив біля великого й священного озера Онтаріо на землі, що стала відомою як штат Нью-Йорк у Північній Америці. У туманах давнини п'ять народів — сенека, онондага, могавки, кайюга та онейда — об'єдналися в одну націю, Хауденосауні, ірокезів. Не маючи писемності, мудреці вашої нації створили великий закон миру, який став моделлю для багатьох конституцій, у тому числі Сполучених Штатів. Протягом багатьох років ваш народ боровся з великими ворогами, такими як гурони, а також французькими та англійськими загарбниками. Хоча ірокези поступалися чисельністю та зіткнулися з набагато досконалішою зброєю, ніж у ваших воїнів, вони вижили та процвітали, поки нарешті не були розбиті потужними арміями нових Сполучених Штатів.
Oh noble Hiawatha, listen to the cries of your people! They call out to you to lead them in peace and war, to rebuild the great longhouse and unite the tribes once again. Will you accept this challenge, great leader? Will you build a civilization that will stand the test of time? = О благородний Гайавато, прислухайся до закликів свого народу! Вони кличуть тебе вести їх у мирі та війні, відбудувати велике довге житло та знову об'єднати племена. Чи приймеш ти цей виклик, великий вождю? Чи зможеш ти побудувати цивілізацію, яка витримає іспит часом?
