Honour be with you, oh great hero Gajah Mada, prime minister of Majapahit and uniter of the Indonesian archipelago. The stories of your heroism on the battlefield are bested only by the legends of your sworn oath to unite the far-flung islands of Indonesia under one banner. Serving your queen and empire with loyalty, you not only strive to fulfill your oath and conquered any who stood in your path, but you succeeded in capturing what was then the entirety of the known archipelago, the first to unite what is today modern Indonesia. = 마자파히트의 수상이자 인도네시아 군도를 통일한 위대한 영웅이신 가자 마다여, 존경을 표합니다. 전장에서 펼친 당신의 영웅적인 업적보다 뛰어난 것은 널리 퍼진 인도네시아의 섬들을 하나의 깃발 아래 뭉치게 한 당신의 맹세입니다. 왕을 모시며 충성을 다해 제국을 섬긴 당신은 맹세를 지켰을 뿐만 아니라, 맹세를 이루는 길에 있는 모든 장해물을 정복하였으며, 알려진 모든 군도를 최초로 정복하여 현대 인도네시아의 기틀을 다졌습니다.
