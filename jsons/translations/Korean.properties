Hail mighty Bismarck, first canchellor of Germany and her empire! Germany is an upstart nation, fashioned from the ruins of the Holy Roman Empire and finally unified in 1871, a little more than a century ago. The German people have proven themselves to be creative, industrious a ferocious warriors. Despite enduring great catastrophes in the first half of the 20th century, Germany remains a worldwide economic, artistic and technological leader. = 독일 제국의 초대 수상, 위대한 비스마르크에 경의를! 독일은 신성 로마 제국의 폐허에서 탄생한 신생 국가로 한 세기 조금 더 전인 1871년에 마침내 통일됐습니다. 독일인은 그들이 창의적이고 성실하면서도 잔인한 전사임을 입증했습니다. 20세기 전반 큰 위기를 겪었음에도, 독일은 여전히 세계의 경제와 예술, 기술을 선도하고 있습니다.
Great Prince Bismarck, the German people look up too you to lead them to greater days of glory. Their determination is strong, and now they turn to you, their beloved iron chancellor, to guide them once more. Will you rile and conquer through blood and iron, or foster the Germanic arts and industry? Can you build a civilization that will stand the test of time? = 위대한 비스마르크여, 독일인은 그대의 지도 하에 다시금 영광을 되찾고 싶어합니다. 독일인은 결의를 굳게 다지며, 존경해 마지않는 철혈 재상이 다시금 독일을 이끌어주리라 기대하고 있습니다. 철과 피로써 지배하고 정복하겠습니까, 아니면 게르만의 예술과 산업을 장려하고 세월의 시련을 이겨낼 문명을 건설해 주시겠습니까?
