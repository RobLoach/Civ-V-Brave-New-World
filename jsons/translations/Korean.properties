Great Works are the creations of [Great Artist]s, [Great Writer]s, and [Great Musician]s. They can also be acquired via conquest, or after your civilization develops its interest in ancient [Artifact]s and starts digging them up from the ruins of the past. = 걸작은 [Great Artist], [Great Writer], [Great Musician]의 창조물입니다. 또한 정복을 통해 획득하거나, 당신의 문명이 고대 [Artifact]에 관심을 갖게 되어 사적지에서 이를 발굴하기 시작하면 얻을 수도 있습니다.
When all slots of a building are filled, there is a possibility of additional [Culture] and [Tourism] bonuses. = 건물의 모든 슬롯이 채워지면, 추가 [Culture] 및 [Tourism] 보너스를 얻을 수도 있습니다.

Once you’ve settled your first two or three cities you’re probably 100 to 150 turns into the game.\nNow is a good time to start thinking about how, exactly, you want to win – if you haven’t already. = 처음 두세 개의 도시를 건설하고 나면, 게임 진행 횟수가 대략 100~150턴 정도 되었을 것입니다.\n아직 결정하지 않았다면, 지금이 정확히 어떤 방식으로 승리할지 고민해 볼 좋은 시기입니다.


