To win a [Culture] Victory, you must become the dominant cultural influence in every civilization in the game. This is achieved through [Tourism] generated by Great Works that you create, and artifacts that you discover. The [Tourism] you generate has a constant impact on other civilizations, and its effect is amplified through Open Borders, Trade Routes, shared Religion and Ideologies, Research Agreements, etc. = [Culture] 승리를 거두려면, 게임 내 모든 문명보다 더 지배적인 문화적 영향력을 행사해야 합니다. 이는 플레이어가 걸작과 발견한 유물을 통해 생성되는 [Tourism]을 통해 달성할 수 있습니다. 플레이어가 생성한 [Tourism]은 다른 문명에 지속적으로 영향을 미치며, 그 효과는 국경 개방, 무역로, 공통 종교, 연구 협정, 특정 이념적 정책들을 통해 [Tourism]을 증폭할 수 있습니다. 