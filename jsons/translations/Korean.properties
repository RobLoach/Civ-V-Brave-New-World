[Tourism] is the key to achieving a Cultural Victory. = [Tourism]는 문화 승리를 위한 핵심 전략입니다.
[Tourism] is generated by Great Works or [Artifact]s that are placed in certain [Culture] buildings, and is the primary yield you will use to spread your cultural influence to other civilizations. As you place more and more Great Works and Artifacts into your [Museum]s, [Amphitheater]s, [Opera House]s, etc., your [Tourism] will continue to increase. Additionally, you can boost your [Tourism] output quite a bit through Open Borders, Trade Routes, shared Religion, and certain Ideological Tenets. = [Tourism]은 특정 [Culture] 건물에 배치된 걸작이나 [Artifact]을 통해 생성되며, 다른 문명에게 문화적 영향력을 확산시키는 데 주로 사용되는 자원입니다. [Museum], [Amphitheater], [Opera House] 등에 걸작과 유물을 점점 더 많이 배치할수록 [Tourism]은 지속적으로 증가합니다. 또한, 국경 개방, 무역로, 공통 종교, 그리고 특정 이념적 정책들을 통해 [Tourism]을 상당히 높일 수 있습니다. 

