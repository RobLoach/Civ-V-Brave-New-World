[Hidden Antiquity Site]s can be dug up by [Archaeologist]s for chance of a [Great Work of Writing] or a Cultural Renaissance. They are revealed by completing the [Exploration] Policy tree. = [Hidden Antiquity Site]는 [Archaeologist]의 발굴을 통해 일정확률로 [Great Work of Writing]를 얻거나 문화 르네상스를 시작하게 합니다. [Exploration] 정책 트리 완성을 통해 발견할 수 있습니다.

