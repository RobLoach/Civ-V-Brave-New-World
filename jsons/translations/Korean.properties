Blessings upon you, noble Oda Nobunaga, ruler of Japan, the land of the Rising Sun! May you long walk among its flowering blossoms. The Japanese are an island people, proud and pious with a rich culture of arts and letters. Your civilization stretches back thousands of years, years of bloody warfare, expansion and isolation, great wealth and great poverty. In addition to their prowess on the field of battle, your people are also immensely industrious, and their technological innovation and mighty factories are the envy of lesser people everywhere. = 태양이 떠오르는 나라를 다스리는 고귀한 오다 노부나가여, 그대가 축복 속에서 피어나는 꽃잎 사이를 오래오래 걷기를 기원합니다. 일본인은 풍부한 예술과 학문, 문화를 자랑하는 섬 민족입니다. 일본 문명의 역사는 수천 년을 거슬러 올라가는 피 튀기는 전쟁의 역사, 확장과 고립의 역사, 엄청난 부와 엄청난 빈곤의 역사입니다. 일본 민족은 전투에 두각을 드러내는 한편으로 매우 성실하기도 하며, 그 기술 혁명과 엄청난 공장은 전 세계 약소국의 부러움을 삽니다.
