Greetings, noble Hiawatha, leader of the mighty Iroquois nations! Long have your people lived near the great and holy lake Ontario in the land that has come to be known as the New York state in North America. In the mists of antiquity, the five peoples of Seneca, Onondaga, Mohawks, Cayugas and Oneida united into one nation, the Haudenosaunee, the Iroquois. With no written language, the wise men of your nation created the great law of peace, the model for many contitutions including that of the United States. For many years, your people battled great enemies, such as the Huron, and the French and English invaders. Tought outnumbered and facing weapons far more advanced than the ones your warriors wielded, the Iroquois survived and prospered, until they were finally overwhelmed by the mighty armies of the new United States. = 반갑습니다, 고귀한 하이어워사여, 막강한 이로쿼이 연맹의 수장이여! 그대의 백성은 '북아메리카의 뉴욕 주'라고 알려지게 된 위대하고 신성한 온타리오 호수 기슭에 오랫동안 살아왔습니다. 까마득한 옛날에 세네카족, 오논다가족, 모호크족, 카유가족, 오네이다족의 다섯 부족이 하나의 나라 '하우데노사우니'를 이루었으니, 이들을 이로쿼이족이라고 합니다. 그대 나라의 현인들은 문자도 존재하지 않는 상황에서, 미국 헌법을 비롯한 여러 헌법의 모범이 된 '위대한 평화의 법'을 제정했습니다. 이로쿼이족은 오랫동안 휴런족, 프랑스와 영국 침략자 등 강대한 적에 맞서 싸웠습니다. 비록 수적으로 열세였고 부족의 전사들이 사용하던 것보다 훨씬 진보한 무기를 상대해야 했음에도 이로쿼이족은 살아남아 번영하다가, 끝내는 신생 미국의 막강한 군대에 제압당하고 말았습니다.
Oh noble Hiawatha, listen to the cries of your people! They call out to you to lead them in peace and war, to rebuild the great longhouse and unite the tribes once again. Will you accept this challenge, great leader? Will you build a civilization that will stand the test of time? = 오 고귀한 하이어워사여! 백성의 부름에 귀를 기울이십시오! 그들은 평화와 전쟁의 시대로 이로쿼이를 이끌어줄 지도자를 갈구하고 있습니다! 도시를 재건하고 다섯 부족을 다시 규합하십시오. 이 시련을 받아들여 세월의 시련을 이겨낼 문명을 건설해 주시겠습니까?
