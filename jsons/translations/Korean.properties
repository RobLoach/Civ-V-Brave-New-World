The people bow to your esteemed will, o wise and illustrious King Ashurbanipal of Assyria. Across the world, you are known as both a scholar and a warrior, and yet the legends represent merely a glimmer of your true ambition. Although your enemies cowered at the thought of your ferocity in conquest, you were most proud of your intellectual pursuits. Your thirst for knowledge led to your establishment of the royal library at Nineveh, which came to represent one of the greatest collections of ancient texts and tablets found anywhere in the world - securing your legacy as one of Assyria's greatest kings. = 아시리아의 현명하고 걸출하신 아슈르바니팔 왕의 귀의에 온 백성이 경배합니다. 전하는 온 세계에 학자이자 전사로 알려지셨으나, 전설은 실제 야망의 윤곽만 겨우 나타낼 뿐입니다. 적은 왕의 용맹한 정복을 생각하며 엎드리지만, 스스로 가장 자랑스러워하시는 것은 바로 지식욕입니다. 지식을 갈구하였기에 니네베에 왕궁 도서관을 지으셨고, 세계에서 가장 거대한 고대 문서와 점토판 도서관이 되어 아시리아에서 가장 위대한 왕의 전설을 남길 수 있었습니다.
Wise and fearsome king, the time has come for you to return the kingdom of Assyria to its greatest heights. Will you once again strive to acquire the knowledge and histories of all the world's peoples? Can you build a civilization that will stand the test of time? = 지혜롭고 용맹한 왕이시여, 아시리아 왕국을 가장 위대했던 시대로 되돌릴 때가 왔습니다. 전 세계의 백성이 지닌 지식과 역사를 얻기 위해 다시 한 번 일어서시겠습니까? 시간의 시련을 견뎌낼 문명을 건설하시겠습니까?
