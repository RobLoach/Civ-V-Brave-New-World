[Cocoa], like [Bananas], is found only in [Jungle]s. You'll have to remove the [Jungle] to improve it with a [Plantation], but it's usually worth your while if you need extra [Happiness] and [Gold]. = [Banana]와 비슷하게 [Cocoa]는 정글에서만 찾을 수 있습니다. [Plantation]을 건설하기 위해 정글을 제거해야 하지만, 추가 [Happiness]과 [Gold]를 위해선 그만한 가치가 있습니다.

[Nutmeg] is a unique luxury resource which appears only in one of the first three [Indonesia]n cities founded on landmasses other than the one their [Capital] is on. = [Nutmeg]는 [Indonesia]의 [Capital]가 위치한 대륙 이외의 대륙에 설립된 최초의 세 개 [Indonesia] 도시 중 한 곳에서만 출현하는 독특한 고급 자원입니다.

[Cloves] are a unique luxury resource which appear only in one of the first three [Indonesia]n cities founded on landmasses other than the one their [Capital] is on. = [Cloves]는 [Indonesia]의 [Capital]가 위치한 대륙 이외의 대륙에 설립된 최초의 세 개 [Indonesia] 도시 중 한 곳에서만 출현하는 독특한 고급 자원입니다.


A [Trade Route] is required in order for a [Caravan] or [Cargo Ship] to establish a trade connection with other civilizations or City-States. = [Caravan]이나 [Cargo Ship]이 다른 문명이나 도시 국가와 무역 관계를 맺으려면 [Trade Route]가 필요합니다.

