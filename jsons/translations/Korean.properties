[Bison] are found in [Plains] and [Grassland], providing [Food] that allows cities in these regions to grow even more rapidly. Improve them with [Camp]s as soon as you're able, and you'll turn nearby cities into [Population] and [Production] centers.  = [Bison]은 [Grassland]과 [Plains]에서 발견되며, 이 지역에서 도시가 더욱 빠르게 성장할 수 있도록 [Food]을 제공합니다. 가능한 [Camp]를 건설해 들소를 육성하면, 인근 도시들을 [Population]와 [Production]의 핵심지로 탈바꿈시킬 수 있습니다.

